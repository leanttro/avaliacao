  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #7c48df;
      --purple-light: #9b6ff5;
      --purple-glow: rgba(124, 72, 223, 0.35);
      --dark: #070710;
      --surface: #0f0f1a;
      --surface2: #16162a;
      --border: rgba(124, 72, 223, 0.2);
      --text: #f0eeff;
      --muted: rgba(240, 238, 255, 0.55);
    }

    html, body {
      min-height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 48px;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(124,72,223,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 0 60px var(--purple-glow), 0 20px 60px rgba(0,0,0,0.6);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 28px 28px 36px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo img { height: 42px; width: auto; }

    .stars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .star {
      font-size: 28px;
      animation: starPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .star:nth-child(1) { animation-delay: 0.15s; }
    .star:nth-child(2) { animation-delay: 0.25s; }
    .star:nth-child(3) { animation-delay: 0.35s; }
    .star:nth-child(4) { animation-delay: 0.45s; }
    .star:nth-child(5) { animation-delay: 0.55s; }

    @keyframes starPop {
      from { opacity: 0; transform: scale(0.3) rotate(-20deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    h1 em { font-style: normal; color: var(--purple-light); }

    .desc {
      font-size: 14px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 24px;
      background: var(--purple);
      border: none;
      border-radius: 16px;
      color: #fff;
      font-family: 'Archivo Black', sans-serif;
      font-size: 16px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 4px 24px var(--purple-glow);
    }

    .btn-google:hover { background: var(--purple-light); transform: scale(1.02); }
    .btn-google:active { transform: scale(0.98); }
    .g-icon { width: 20px; height: 20px; flex-shrink: 0; }

    .secondary-btns {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      padding: 14px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .btn-secondary:hover { border-color: var(--purple-light); color: var(--purple-light); }
    .btn-insta:hover { border-color: #e1306c; color: #e1306c; }

    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: rgba(240,238,255,0.2);
      line-height: 1.5;
    }

    /* ── Instagram Bottom Sheet ── */
    .insta-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .insta-overlay.open { display: flex; animation: overlayIn 0.2s ease; }

    @keyframes overlayIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    .insta-sheet {
      width: 100%;
      max-width: 430px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      padding: 12px 24px 44px;
      animation: sheetUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); } to { transform: translateY(0); }
    }

    .sheet-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      margin: 0 auto 20px;
    }

    .insta-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .insta-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      background: linear-gradient(var(--surface2), var(--surface2)) padding-box,
                  linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) border-box;
      overflow: hidden;
      flex-shrink: 0;
    }

    .insta-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .insta-info { text-align: left; }

    .insta-name {
      font-family: 'Archivo Black', sans-serif;
      font-size: 15px; margin-bottom: 2px;
    }

    .insta-handle { font-size: 13px; color: var(--muted); }

    .insta-bio {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      text-align: left;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .insta-stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      text-align: center;
    }

    .stat-num {
      font-family: 'Archivo Black', sans-serif;
      font-size: 17px; display: block;
    }

    .stat-label {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .btn-insta-open {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-family: 'Archivo Black', sans-serif;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-sheet-close {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      font-family: 'Archivo Black', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .btn-sheet-close:hover { border-color: var(--muted); }
  </style>
</head>
